server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # index.html, manifest.webmanifest y el service worker nunca deben
    # quedar cacheados por el navegador/CDN: son los tres archivos que
    # avisan "hay una versión nueva". Cachearlos sería que una actualización
    # tarde en notarse hasta que expire el TTL.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        default_type application/manifest+json;
    }
    location = /sw.js {
        add_header Cache-Control "no-cache";
        default_type application/javascript;
    }

    # Assets hasheados por Vite (build/client/assets/*) -- el nombre de
    # archivo cambia si el contenido cambia, así que sí pueden cachearse
    # agresivo.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA: react-router maneja el ruteo client-side. Sin esto, refrescar en
    # /hitl o /budget (o cualquier ruta que no sea /) da 404 de nginx en vez
    # de servir la app -- ssr:false significa que no hay nada en el servidor
    # que sepa de esas rutas, solo el index.html + JS.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
